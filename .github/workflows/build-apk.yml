name: Build VibeMusic3D APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK 37 Preview
        shell: bash
        run: |
          set -e
          echo "Checking preview package availability..."
          sdkmanager --list --channel=3 | grep -E 'platforms;android-37( |$)' || true
          echo "Installing Android 17 / API 37 platform from preview channel..."
          sdkmanager --channel=3 --install "platforms;android-37"
          sdkmanager --install "platform-tools" "build-tools;36.0.0"

      - name: Extract VibeMusic3D project
        run: |
          set -e
          rm -rf extracted
          unzip -q VibeMusic3D_Final.zip -d extracted

      - name: Locate and patch compileSdk
        shell: bash
        run: |
          set -e
          PROJECT_DIR="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

          echo "compileSdk before patch:"
          grep -RIn --include='*.gradle' --include='*.gradle.kts' --include='*.toml' 'compileSdk' "$PROJECT_DIR" || true

          find "$PROJECT_DIR" -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.toml' \) -print0 |
            xargs -0 -r sed -i -E \
              -e 's/(compileSdk[[:space:]]*=[[:space:]]*)36/\137/g' \
              -e 's/(compileSdk[[:space:]]+)36/\137/g'

          echo "compileSdk after patch:"
          grep -RIn --include='*.gradle' --include='*.gradle.kts' --include='*.toml' 'compileSdk' "$PROJECT_DIR" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Show generated APK
        run: find "${PROJECT_DIR}/app/build/outputs" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeMusic3D-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
